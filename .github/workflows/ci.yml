name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    web:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6 # version comes from packageManager in package.json

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            # Needs no DATABASE_URL: pages and API routes only query the database at request time.
            - name: Build
              run: pnpm build

    pipeline:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install dependencies from lockfile
              run: uv sync --frozen

            - name: Test
              run: uv run pytest
